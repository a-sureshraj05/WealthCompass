<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover is required for env(safe-area-inset-*), used by MobileTabBar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WealthCompass - Secure Consolidation</title>
    <!--
      Previously this file loaded Tailwind from cdn.tailwindcss.com and declared
      an importmap pointing React, Recharts and @google/genai at esm.sh. Both are
      gone: every page load depended on two third parties staying up, and the
      importmap shadowed whatever Vite had already bundled. Tailwind is now a
      build dependency (see tailwind.config.js) and React/Recharts are bundled.
      @google/genai and react-plaid-link were dropped outright — nothing imported
      either one.

      The Google Fonts link below is the one remaining external request. It is a
      stylesheet rather than a script, and a font that fails to load degrades to
      the system sans-serif instead of breaking the app, so it is left in place.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
