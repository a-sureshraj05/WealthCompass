
<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover is required for env(safe-area-inset-*), used by MobileTabBar -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WealthCompass - Secure Consolidation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        html {
            font-size: 90%;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #F5F5F7;
        }
        .font-display {
            font-family: 'Hanken Grotesk', sans-serif;
        }
        /* Clears the fixed MobileTabBar: its 56px row plus the home-indicator
           inset, plus a little breathing room. Derived from the bar's real
           height rather than a round number, so there's no dead space under
           the last card. Uses px for the bar because the root font-size is 90%
           above, which would make a rem-based figure ~10% short.
           Written here rather than as a Tailwind class because `md:p-8` on the
           same element is a shorthand that resets every side, and would knock
           the bottom clearance out between md and lg — where the bar is still
           visible. */
        .pb-tabbar {
            padding-bottom: calc(56px + env(safe-area-inset-bottom) + 1rem);
        }
        @media (min-width: 1024px) {
            /* Tab bar is lg:hidden, so fall back to the normal page padding. */
            .pb-tabbar { padding-bottom: 2rem; }
        }
    </style>
