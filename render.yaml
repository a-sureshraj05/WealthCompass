# Render blueprint for WealthCompass: the real multi-tenant app plus a
# public fabricated-data demo.
#
# Both services below are on the Free instance type as of 2026-10-31 — a
# deliberate cost call while real usage is still low, not an oversight. Free
# means each service sleeps after ~15 min idle and takes ~30-50s to wake on
# the next request. Known, accepted consequence for wealthcompass-app
# specifically (not just slower): its session design keeps each logged-in
# user's decryption key in server-process memory only (see
# backend/app/core/session_store.py); a Free-tier sleep terminates that
# process, so anyone logged in when it sleeps is silently signed out, even
# though their cookie is still technically valid. Revisit (`plan: starter`,
# $7/mo each) once real traffic or that logout annoyance makes it worth it.
#
# This service is Blueprint-managed: Render reconciles the dashboard against
# this file on every sync. Changing the plan ONLY in the dashboard gets
# silently reverted back to whatever `plan:` says here on the next deploy.
# Any future plan change must be made here, not just in the UI.
#
# Nothing here locks the project to Render. The Dockerfile is the whole
# deployment; moving to Koyeb, Cloud Run or Fly means writing that platform's
# config file and pointing it at the same image.

services:
  # The REAL multi-user app. Becomes https://wealthcompass-app.onrender.com.
  #
  # Named "wealthcompass-app", not plain "wealthcompass": that bare name is
  # already claimed by another Render customer (confirmed early on — a
  # collision silently becomes wealthcompass-iy9v.onrender.com rather than
  # failing). Subdomains are globally unique across all Render customers and
  # can't be checked from outside beforehand, so this name could collide too.
  #
  # Serves BOTH the API and the built frontend from a single process
  # (main.py mounts frontend/dist as a SPA fallback whenever it exists in the
  # image, which it always does) — no separate frontend host needed. What
  # makes this the real app rather than the demo is simply the environment
  # it's given: no WC_DEMO_MODE (so there's no seed/reset loop and no
  # baked-demo-data reset timer) and a DATABASE_URL pointed at Supabase
  # instead of the throwaway SQLite baked into the image.
  #
  # Registration is gated by invite codes (see
  # backend/scripts/create_invite_codes.py) regardless of WC_ALLOW_REGISTRATION,
  # so this is safe to leave open.
  #
  # Changing `name:` renames the service in the Blueprint; the URL follows
  # the name, and the previous URL stops resolving. Nothing else in the
  # deployment depends on it.
  - type: web
    name: wealthcompass-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz

    envVars:
      - key: JWT_SECRET
        generateValue: true

      # Supabase SESSION POOLER string (Supavisor, port 5432, host
      # aws-0-<region>.pooler.supabase.com, username postgres.<project-ref>)
      # — NOT Supabase's "Direct connection" string, and NOT the Transaction
      # pooler on port 6543.
      #
      # Direct connection fails outright on Render: Supabase resolves that
      # hostname to IPv6-only, and Render has no outbound IPv6 route —
      # confirmed via a real failed deploy ("Network is unreachable",
      # psycopg2.OperationalError). Supavisor's shared pooler is IPv4-only
      # on every tier regardless of mode, which fixes that.
      #
      # Session mode specifically (not Transaction mode) because it preserves
      # session-level Postgres state across statements — this app's
      # prices.py holds a session-scoped pg_advisory_lock across a multi-
      # commit critical section, which Transaction-mode pooling would break
      # (the pooler can reassign the underlying connection between the lock
      # and unlock calls, silently losing the lock's guarantee).
      #
      # `sync: false` means Render creates the key and leaves it blank for
      # one-time manual entry in the dashboard; a Blueprint sync will not
      # overwrite a value entered there, same guarantee already relied on
      # for the demo's ANTHROPIC_API_KEY below — the connection string
      # itself never enters this repository.
      - key: DATABASE_URL
        sync: false

  # The PUBLIC DEMO — fabricated data only, resets every 12h (or on every
  # sleep/wake while on the Free plan). Becomes
  # https://wealthcompass-demo.onrender.com.
  #
  # Named "wealthcompass-demo": this name was previously held by an orphaned
  # service pointed at a stale, disconnected repo (a-sureshraj05/WealthCompass-dev-archive,
  # last pushed 2026-09-09) — that service has since been deleted, freeing
  # this name up for the correctly-connected replacement below.
  - type: web
    name: wealthcompass-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .

    # Render injects PORT and requires the container to listen on it. The
    # Dockerfile's CMD reads ${PORT:-8000} for exactly this reason.
    healthCheckPath: /healthz

    envVars:
      - key: WC_DEMO_MODE
        value: "true"

      # 720 minutes = 12 hours. On the free plan this rarely fires in practice —
      # the instance sleeps after ~15 min idle, and waking up (which restores
      # the baked template) IS the reset. Only matters if the service gets
      # enough steady traffic to stay awake continuously for 12h+ straight,
      # in which case this timer is the backstop.
      - key: WC_DEMO_RESET_MINUTES
        value: "720"

      # Without a stable secret, auth.py generates a random signing key per
      # process and every visitor is logged out on each restart — which, on a
      # plan that sleeps, means constantly. generateValue makes Render create
      # one once and keep it.
      - key: JWT_SECRET
        generateValue: true

      # Shorter than the local 24h default. A demo session has no reason to
      # outlive the instance that issued it.
      - key: JWT_EXPIRE_MINUTES
        value: "120"

      # ANTHROPIC_API_KEY (AI insights and portfolio chat) comes from the
      # "WealthCompass" environment group, created in the dashboard. The value
      # lives there and never enters this repository.
      #
      # Declared here rather than left as a dashboard-only link because the
      # service is Blueprint-managed: Render reconciles the service's
      # environment against this file, so a link made only in the UI can be
      # dropped on a later sync — silently switching the AI features off with
      # nothing in any diff to explain it.
      #
      # Note this replaced a service-level `- key: ANTHROPIC_API_KEY` with
      # `sync: false`. Service-level variables take precedence over group ones,
      # so that entry would have shadowed the group's value with an empty one —
      # the group would be correctly linked and the key still would not arrive.
      #
      # Absent the group the app is unaffected: both AI features report
      # themselves unconfigured and every other route works normally.
      - fromGroup: WealthCompass
